<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>וורדעל</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0f0f13;
      color: #f0f0f8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      user-select: none;
      -webkit-user-select: none;
    }
    .page {
      max-width: 420px;
      margin: 0 auto;
      padding: 10px 10px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
    }

    /* HEADER */
    .header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-bottom: 1px solid #2e2e42;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .header h1 { font-size: 26px; font-weight: 900; letter-spacing: 2px; }
    .header .sub { font-size: 11px; color: #8888aa; margin-top: 2px; text-align: center; }
    .header-day {
      position: absolute;
      left: 0;
      font-size: 11px;
      color: #8888aa;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .header-day-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .header-day-line1 { font-size: 11px; color: #8888aa; }
    .header-day-line2 { font-size: 11px; color: #aaaacc; }
    .switch-user-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      opacity: 0.7;
      transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .switch-user-btn:hover { opacity: 1; }
    .header-link {
      position: absolute;
      right: 0;
      font-size: 11px;
      color: #6c63ff;
      text-decoration: none;
      border: 1px solid #6c63ff;
      border-radius: 8px;
      padding: 3px 8px;
    }

    /* GRID */
    .grid {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 14px;
    }
    .grid-row {
      display: flex;
      flex-direction: row;
      gap: 5px;
    }
    .cell {
      width: 56px;
      height: 56px;
      border: 2px solid #2e2e42;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      color: #f0f0f8;
      transition: border-color 0.08s;
      perspective: 250px;
    }
    .cell.filled  { border-color: #5a5a7a; }
    .cell.active  { border-color: #9898b8; }
    .cell.correct { background: #538d4e; border-color: #538d4e; color: #fff; }
    .cell.present { background: #b59f3b; border-color: #b59f3b; color: #fff; }
    .cell.absent  { background: #3a3a4a; border-color: #3a3a4a; color: #ccc; }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    .cell.pop { animation: pop 0.1s ease; }

    @keyframes flip {
      0%   { transform: rotateX(0deg); }
      50%  { transform: rotateX(-90deg); }
      100% { transform: rotateX(0deg); }
    }
    .cell.flip { animation: flip 0.45s ease forwards; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-7px); }
      40%     { transform: translateX(7px); }
      60%     { transform: translateX(-4px); }
      80%     { transform: translateX(4px); }
    }
    .grid-row.shake { animation: shake 0.4s ease; }

    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      40%     { transform: translateY(-10px); }
    }
    .cell.bounce { animation: bounce 0.55s ease; }

    /* KEYBOARD */
    .keyboard {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .kb-row {
      display: flex;
      justify-content: center;
      gap: 4px;
      direction: ltr;
    }
    .key {
      background: #2e2e42;
      border: none;
      border-radius: 6px;
      color: #f0f0f8;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      height: 52px;
      min-width: 28px;
      flex: 1;
      max-width: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, opacity 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .key.wide    { max-width: 58px; font-size: 13px; }
    .key.correct { background: #538d4e; color: #fff; }
    .key.present { background: #b59f3b; color: #fff; }
    .key.absent  { background: #1c1c2a; color: #555; }
    .key:active  { opacity: 0.65; }

    /* TOAST */
    .toast {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%) translateY(-6px);
      background: #f0f0f8;
      color: #0f0f13;
      padding: 9px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      opacity: 0;
      transition: all 0.2s;
      z-index: 999;
      white-space: nowrap;
      pointer-events: none;
      max-width: 90vw;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* MODAL */
    .modal-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 800;
      opacity: 0; transition: opacity 0.25s;
      pointer-events: none;
    }
    .modal-bg.show { opacity: 1; pointer-events: all; }
    .modal {
      background: #1a1a28;
      border: 1px solid #2e2e42;
      border-radius: 16px;
      padding: 28px 24px;
      width: 300px;
      text-align: center;
    }
    .modal .emoji  { font-size: 52px; margin-bottom: 10px; }
    .modal h2      { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .modal p       { color: #8888aa; font-size: 14px; margin-bottom: 6px; }
    .modal .answer { font-size: 26px; font-weight: 900; color: #f0f0f8; margin-bottom: 18px; letter-spacing: 4px; }
    .modal-btns    { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .modal-btn {
      background: none;
      border: 1.5px solid #2e2e42;
      border-radius: 10px;
      color: #f0f0f8;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 18px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    .modal-btn:hover     { border-color: #8888aa; }
    .modal-btn.primary   { border-color: #6c63ff; color: #6c63ff; }

    /* USER MODAL */
    .user-modal-input {
      width: 100%;
      background: #0f0f13;
      border: 1.5px solid #2e2e42;
      border-radius: 10px;
      color: #f0f0f8;
      font-size: 16px;
      font-family: inherit;
      padding: 10px 14px;
      margin-bottom: 14px;
      text-align: right;
      direction: rtl;
      outline: none;
      transition: border-color 0.15s;
    }
    .user-modal-input:focus { border-color: #6c63ff; }
    .user-modal-input::placeholder { color: #555570; }
    .existing-users {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 14px;
    }
    .existing-user-btn {
      background: #2e2e42;
      border: 1.5px solid #3e3e58;
      border-radius: 20px;
      color: #f0f0f8;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .existing-user-btn:hover { border-color: #6c63ff; background: #3a3a55; }
    .stats-line {
      font-size: 13px;
      color: #aaaacc;
      margin-bottom: 14px;
      direction: rtl;
    }

    /* SHARE RESULT */
    .share-grid { font-size: 20px; line-height: 1.4; margin: 14px 0; letter-spacing: 2px; }

    @media (max-width: 360px) {
      .cell { width: 48px; height: 48px; font-size: 20px; }
      .key  { height: 46px; font-size: 14px; }
    }
    @media (max-height: 680px) {
      .cell { width: 50px; height: 50px; }
      .grid { gap: 4px; margin-bottom: 10px; }
      .keyboard { gap: 4px; }
      .key { height: 44px; }
    }
  </style>
</head>
<body>
<div class="page">
  <div class="header">
    <a class="header-link" href="index.html">חיבורי מילים</a>
    <div>
      <h1>וורדעל</h1>
      <div class="sub">נחש את המילה בת 5 האותיות</div>
    </div>

      </div>
      <button class="switch-user-btn" id="switch-user-btn" title="החלף משתמש" style="display:none">🔄</button>
    </div>
  </div>

  <div class="grid"     id="grid"></div>
  <div class="keyboard" id="keyboard"></div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal"></div>
</div>

<div class="modal-bg" id="user-modal-bg">
  <div class="modal" id="user-modal"></div>
</div>

// Filter to exactly 5 Hebrew characters
const WORD_LEN = 5;
const validAnswers = ANSWERS.filter(w => [...w].length === WORD_LEN);

// ══════════════════════════════════════════════════════
//  USER MANAGEMENT
// ══════════════════════════════════════════════════════
const USERS_KEY = 'wordle_users_v1';
const CURRENT_USER_KEY = 'wordle_current_user';

function getUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY)) || {}; }
  catch { return {}; }
}
function saveUsers(users) {
  localStorage.setItem(USERS_KEY, JSON.stringify(users));
}
function getCurrentUser() {
  return localStorage.getItem(CURRENT_USER_KEY) || null;
}
function setCurrentUser(name) {
  localStorage.setItem(CURRENT_USER_KEY, name);
}
function ensureUser(name) {
  const users = getUsers();
  if (!users[name]) users[name] = { games: [] };
  saveUsers(users);
}
function recordGameResult(score) {
  const user = getCurrentUser();
  if (!user) return;
  const users = getUsers();
  if (!users[user]) users[user] = { games: [] };
  users[user].games.push(score);
  saveUsers(users);
}
function getUserStats(name) {
  const users = getUsers();
  const u = users[name];
  if (!u || !u.games || u.games.length === 0) return null;
  const games = u.games;
  const total = games.length;
  const wins = games.filter(g => g <= 6).length;
  const sum = games.reduce((a, b) => a + b, 0);
  const avg = (sum / total).toFixed(1);
  return { total, wins, avg };
}
function updateHeaderStats() {
  const user = getCurrentUser();
  const label = wordOffset > 0 ? `יום ${dayIdx + 1} · מילה ${wordOffset + 1}` : `יום ${dayIdx + 1}`;
  document.getElementById('day-line1').textContent = label;
  if (user) {
    const stats = getUserStats(user);
    const avgText = stats ? `ממוצע ${stats.avg}` : '';
    document.getElementById('day-line2').textContent = stats ? `${user} · ${avgText}` : user;
    document.getElementById('switch-user-btn').style.display = '';
  } else {
    document.getElementById('day-line2').textContent = '';
    document.getElementById('switch-user-btn').style.display = 'none';
  }
}

function showUserModal() {
  const users = getUsers();
  const names = Object.keys(users);
  const userModal = document.getElementById('user-modal');

  let existingHtml = '';
  if (names.length > 0) {
    existingHtml = `
      <div style="font-size:13px;color:#8888aa;margin-bottom:8px;direction:rtl;">משתמשים קיימים:</div>
      <div class="existing-users">
        ${names.map(n => `<button class="existing-user-btn" onclick="selectExistingUser('${n.replace(/'/g, "\\'")}')">  ${n}</button>`).join('')}
      </div>
    `;
  }

  userModal.innerHTML = `
    <div class="emoji">👤</div>
    <h2>מה השם שלך?</h2>
    <p style="margin-bottom:14px;">הכנס שם כדי לשמור את הניקוד שלך</p>
    ${existingHtml}
    <input class="user-modal-input" type="text" id="user-name-input" dir="rtl" placeholder="שם חדש..." maxlength="20" />
    <div class="modal-btns">
      <button class="modal-btn primary" onclick="startWithNewUser()">התחל לשחק</button>
    </div>
  `;

  document.getElementById('user-modal-bg').classList.add('show');

  setTimeout(() => {
    const inp = document.getElementById('user-name-input');
    if (inp) inp.focus();
  }, 300);

  setTimeout(() => {
    const inp = document.getElementById('user-name-input');
    if (inp) inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.stopPropagation(); startWithNewUser(); }
    });
  }, 0);
}

function closeUserModal() {
  document.getElementById('user-modal-bg').classList.remove('show');
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
}

window.selectExistingUser = function(name) {
  setCurrentUser(name);
  ensureUser(name);
  closeUserModal();
  updateHeaderStats();
};

window.startWithNewUser = function() {
  const inp = document.getElementById('user-name-input');
  const name = inp ? inp.value.trim() : '';
  if (!name) {
    inp && inp.focus();
    showToast('אנא הכנס שם');
    return;
  }
  setCurrentUser(name);
  ensureUser(name);
  closeUserModal();
  updateHeaderStats();
};

document.getElementById('switch-user-btn').addEventListener('click', () => {
  showUserModal();
});

// ══════════════════════════════════════════════════════
//  DAILY WORD
// ══════════════════════════════════════════════════════
const EPOCH = new Date('2024-01-01').getTime();
function getTodayIdx() {
  const today = new Date();
  const d = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();
  return Math.floor((d - EPOCH) / 86400000);
}
const dayIdx  = getTodayIdx();
let wordOffset = 0;
let ANSWER  = validAnswers[(dayIdx + wordOffset) % validAnswers.length];
const MAX_ROWS = 6;

// ══════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════
let guesses   = [];     // submitted words
let colors    = [];     // colors[r][c] = 'correct'|'present'|'absent'
let current   = '';
let gameOver  = false;
let revealing = false;

// ══════════════════════════════════════════════════════
//  SCORING (normalizes sofit ↔ base for comparison)
// ══════════════════════════════════════════════════════
function scoreWord(word) {
  const result = Array(WORD_LEN).fill('absent');
  const ansArr = [...ANSWER].map(normBase);
  const wordArr = [...word].map(normBase);
  const used = Array(WORD_LEN).fill(false);

  // Pass 1: correct
  for (let i = 0; i < WORD_LEN; i++) {
    if (wordArr[i] === ansArr[i]) {
      result[i] = 'correct';
      used[i] = true;
    }
  }
  // Pass 2: present
  for (let i = 0; i < WORD_LEN; i++) {
    if (result[i] === 'correct') continue;
    for (let j = 0; j < WORD_LEN; j++) {
      if (!used[j] && wordArr[i] === ansArr[j]) {
        result[i] = 'present';
        used[j] = true;
        break;
      }
    }
  }
  return result;
}

// ══════════════════════════════════════════════════════
//  BUILD DOM
// ══════════════════════════════════════════════════════
function buildGrid() {
  const el = document.getElementById('grid');
  el.innerHTML = '';
  for (let r = 0; r < MAX_ROWS; r++) {
    const row = document.createElement('div');
    row.className = 'grid-row';
    row.id = 'row-' + r;
    for (let c = 0; c < WORD_LEN; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = `cell-${r}-${c}`;
      row.appendChild(cell);
    }
    el.appendChild(row);
  }
}

// QWERTY Hebrew Standard layout, LTR key order (matches physical keyboard left-to-right)
// Row 1: E=ק R=ר T=א Y=ט U=ו [skip I=ן O=ם sofit] P=פ
// Row 2: A=ש S=ד D=ג F=כ G=ע H=י J=ח K=ל [skip L=ך ;=ף sofit]
// Row 3: Z=ז X=ס C=ב V=ה B=נ N=מ M=צ ,=ת [skip .=ץ sofit]
const KB_ROWS = [
  ['ק','ר','א','ט','ו','פ'],
  ['ש','ד','ג','כ','ע','י','ח','ל'],
  ['שלח','ז','ס','ב','ה','נ','מ','צ','ת','⌫'],
];

// Auto-sofit: when a letter is typed at the last position, convert to sofit form
const SOFIT_MAP = { 'כ':'ך', 'פ':'ף', 'נ':'ן', 'מ':'ם', 'צ':'ץ' };
// Reverse: normalize sofit to base for keyboard coloring & scoring
const SOFIT_TO_BASE = { 'ך':'כ', 'ף':'פ', 'ן':'נ', 'ם':'מ', 'ץ':'צ' };
function normBase(ch) { return SOFIT_TO_BASE[ch] || ch; }
function buildKeyboard() {
  const el = document.getElementById('keyboard');
  el.innerHTML = '';
  KB_ROWS.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'kb-row';
    row.forEach(k => {
      const btn = document.createElement('button');
      const isWide = k === 'שלח' || k === '⌫';
      btn.className = 'key' + (isWide ? ' wide' : '');
      btn.textContent = k;
      btn.dataset.key = k;
      btn.addEventListener('click', () => handleKey(k));
      if (k !== 'שלח' && k !== '⌫') btn.id = 'key-' + k;
      rowEl.appendChild(btn);
    });
    el.appendChild(rowEl);
  });
}

// ══════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════
function renderGrid() {
  // Submitted rows
  for (let r = 0; r < guesses.length; r++) {
    const word = [...guesses[r]];
    for (let c = 0; c < WORD_LEN; c++) {
      const cell = document.getElementById(`cell-${r}-${c}`);
      cell.textContent = word[c] || '';
      cell.className   = 'cell ' + (colors[r] ? colors[r][c] : 'filled');
    }
  }
  // Current input row
  const r = guesses.length;
  if (r < MAX_ROWS) {
    const cur = [...current];
    for (let c = 0; c < WORD_LEN; c++) {
      const cell = document.getElementById(`cell-${r}-${c}`);
      cell.textContent = cur[c] || '';
      if (cur[c]) {
        cell.className = 'cell filled' + (c === cur.length - 1 ? ' active' : '');
      } else {
        cell.className = 'cell' + (c === cur.length ? ' active' : '');
      }
    }
    // Empty rows below
    for (let rr = r + 1; rr < MAX_ROWS; rr++) {
      for (let c = 0; c < WORD_LEN; c++) {
        const cell = document.getElementById(`cell-${rr}-${c}`);
        cell.textContent = '';
        cell.className   = 'cell';
      }
    }
  }
}

function updateKeyboard() {
  const best = {};
  guesses.forEach((word, r) => {
    if (!colors[r]) return;
    [...word].forEach((letter, c) => {
      const st = colors[r][c];
      const prev = best[letter];
      if (!prev || (st === 'correct') || (st === 'present' && prev === 'absent')) {
        best[letter] = st;
      }
    });
  });
  // normalize sofit to base before looking up key
  const bestNorm = {};
  Object.entries(best).forEach(([l, v]) => {
    const base = normBase(l);
    const prev = bestNorm[base];
    if (!prev || (v === 'correct') || (v === 'present' && prev === 'absent')) bestNorm[base] = v;
  });
  const allLetters = 'אבגדהוזחטיכלמנסעפצקרשת';
  [...allLetters].forEach(l => {
    const btn = document.getElementById('key-' + l);
    if (!btn) return;
    btn.className = 'key' + (bestNorm[l] ? ' ' + bestNorm[l] : '');
  });
}

// ══════════════════════════════════════════════════════
//  INPUT
// ══════════════════════════════════════════════════════
// Accept base Hebrew letters only (sofit handled via auto-conversion)
const HEBREW = new Set([...'אבגדהוזחטיכלמנסעפצקרשת']);
// Also accept sofit directly (from physical keyboard) — normalize to base
const HEBREW_ALL = new Set([...'אבגדהוזחטיכלמנסעפצקרשתךףןםץ']);

function handleKey(k) {
  if (gameOver || revealing) return;
  if (k === '⌫') {
    if (current.length > 0) current = [...current].slice(0, -1).join('');
    renderGrid();
    return;
  }
  if (k === 'שלח' || k === 'Enter') {
    submit();
    return;
  }
  // Normalize sofit input to base letter first, then auto-convert at last position
  let letter = normBase(k);
  if (HEBREW.has(letter) && [...current].length < WORD_LEN) {
    const pos = [...current].length;
    if (pos === WORD_LEN - 1 && SOFIT_MAP[letter]) {
      letter = SOFIT_MAP[letter]; // auto-convert to sofit at last position
    }
    current += letter;
    const r = guesses.length;
    const c = [...current].length - 1;
    const cell = document.getElementById(`cell-${r}-${c}`);
    if (cell) {
      cell.classList.remove('pop');
      void cell.offsetWidth;
      cell.classList.add('pop');
    }
    renderGrid();
  }
}

// Physical keyboard: sofit keys map to their base form (auto-sofit handles conversion)
const KEY_MAP = {
  'e':'ק','r':'ר','t':'א','y':'ט','u':'ו',
  'i':'נ', // I=ן(sofit) → נ base
  'o':'מ', // O=ם(sofit) → מ base
  'p':'פ',
  'a':'ש','s':'ד','d':'ג','f':'כ','g':'ע','h':'י','j':'ח','k':'ל',
  'l':'כ', // L=ך(sofit) → כ base
  ';':'פ', // ;=ף(sofit) → פ base
  'z':'ז','x':'ס','c':'ב','v':'ה','b':'נ','n':'מ','m':'צ',
  ',':'ת',
  '.':'צ', // .=ץ(sofit) → צ base
};
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key === 'Backspace') { e.preventDefault(); handleKey('⌫'); return; }
  if (e.key === 'Enter')     { e.preventDefault(); handleKey('שלח'); return; }
  if (HEBREW_ALL.has(e.key)) { handleKey(e.key); return; }
  const mapped = KEY_MAP[e.key.toLowerCase()];
  if (mapped) handleKey(mapped);
});

// ══════════════════════════════════════════════════════
//  SUBMIT
// ══════════════════════════════════════════════════════
function submit() {
  if ([...current].length < WORD_LEN) {
    shakeRow(guesses.length);
    showToast('המילה חייבת להכיל ' + WORD_LEN + ' אותיות');
    return;
  }

  const word  = current;
  const rowIdx = guesses.length;
  const score  = scoreWord(word);

  guesses.push(word);
  current = '';
  renderGrid();

  revealing = true;
  revealRow(rowIdx, score, () => {
    colors[rowIdx] = score;
    revealing = false;
    renderGrid();
    updateKeyboard();

    const won = score.every(s => s === 'correct');
    if (won) {
      gameOver = true;
      bounceRow(rowIdx, () => {
        const labels = ['מושלם! 🎯','מדהים! 🏆','מעולה! ⭐','יפה מאוד! 🎉','כמעט! 😅','פוף! 😮‍💨'];
        setTimeout(() => showEndModal(true, labels[rowIdx] || 'כן!!!'), 400);
      });
    } else if (guesses.length >= MAX_ROWS) {
      gameOver = true;
      setTimeout(() => showEndModal(false), 500);
    }
  });
}

// ══════════════════════════════════════════════════════
//  ANIMATIONS
// ══════════════════════════════════════════════════════
function revealRow(rowIdx, score, cb) {
  const DELAY = 320;
  for (let c = 0; c < WORD_LEN; c++) {
    const cell = document.getElementById(`cell-${rowIdx}-${c}`);
    setTimeout(() => {
      cell.classList.add('flip');
      setTimeout(() => {
        cell.className = 'cell flip ' + score[c];
      }, 225);
    }, c * DELAY);
  }
  setTimeout(cb, WORD_LEN * DELAY + 200);
}

function shakeRow(rowIdx) {
  const row = document.getElementById('row-' + rowIdx);
  if (!row) return;
  row.classList.remove('shake');
  void row.offsetWidth;
  row.classList.add('shake');
  setTimeout(() => row.classList.remove('shake'), 500);
}

function bounceRow(rowIdx, cb) {
  const DELAY = 90;
  const cells = document.querySelectorAll(`#row-${rowIdx} .cell`);
  cells.forEach((cell, i) => {
    setTimeout(() => {
      cell.classList.add('bounce');
      setTimeout(() => cell.classList.remove('bounce'), 700);
    }, i * DELAY);
  });
  setTimeout(cb, cells.length * DELAY + 700);
}

// ══════════════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════════════
let toastTimer;
function showToast(msg, dur = 2200) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), dur);
}

// ══════════════════════════════════════════════════════
//  END MODAL
// ══════════════════════════════════════════════════════
function buildShareGrid() {
  return guesses.map((_, r) => {
    const c = colors[r];
    if (!c) return '';
    return c.map(s => s === 'correct' ? '🟩' : s === 'present' ? '🟨' : '⬛').join('');
  }).join('\n');
}

function showEndModal(won) {
  // Record the result
  const scoreToRecord = won ? guesses.length : (MAX_ROWS + 1);
  recordGameResult(scoreToRecord);
  updateHeaderStats();

  const modal = document.getElementById('modal');
  const attempts = guesses.length;
  const share = buildShareGrid();

  // Build stats line
  const user = getCurrentUser();
  let statsHtml = '';
  if (user) {
    const stats = getUserStats(user);
    if (stats) {
      statsHtml = `<div class="stats-line">סה״כ משחקים: ${stats.total} | ממוצע: ${stats.avg} | ניצחונות: ${stats.wins}/${stats.total}</div>`;
    }
  }

  modal.innerHTML = `
    <div class="emoji">${won ? '🎉' : '😔'}</div>
    <h2>${won ? 'כל הכבוד!' : 'אולי בפעם הבאה'}</h2>
    ${won
      ? `<p>פתרת ב-${attempts} נסיון${attempts === 1 ? '' : 'ות'}!</p>`
      : `<p>המילה הייתה:</p><div class="answer">${ANSWER}</div>`
    }
    <div class="share-grid">${share}</div>
    ${statsHtml}
    <div class="modal-btns">
      <button class="modal-btn primary" onclick="nextWord()">▶ מילה הבאה</button>
      <button class="modal-btn" onclick="copyShare()">📋 שתף</button>
      <button class="modal-btn" onclick="closeModal()">סגור</button>
    </div>
  `;

  const bg = document.getElementById('modal-bg');
  bg.classList.add('show');
}

function closeModal() {
  document.getElementById('modal-bg').classList.remove('show');
}

window.nextWord = function() {
  wordOffset++;
  ANSWER = validAnswers[(dayIdx + wordOffset) % validAnswers.length];
  guesses   = [];
  colors    = [];
  current   = '';
  gameOver  = false;
  revealing = false;
  closeModal();
  buildGrid();
  buildKeyboard();
  renderGrid();
  updateHeaderStats();
};

window.copyShare = function() {
  const share = buildShareGrid();
  const text  = `וורדעל יום ${dayIdx}\n${guesses.length}/${MAX_ROWS}\n\n${share}`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('הועתק! 👍'));
  } else {
    showToast(text, 4000);
  }
};

// Close modal on background click
document.getElementById('modal-bg').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-bg')) closeModal();
});

// ══════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════
buildGrid();
buildKeyboard();
renderGrid();
updateHeaderStats();

// Show user modal on load if no current user
if (!getCurrentUser()) {
  showUserModal();
}
</script>
