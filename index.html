<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>חיבורי מילים</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0f0f13;
      color: #f0f0f8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 14px 40px;
    }

    /* HEADER */
    .header { text-align: center; margin-bottom: 6px; }
    .header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .header p  { font-size: 13px; color: #8888aa; margin-top: 4px; }

    /* DIFFICULTY LEGEND */
    .legend {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 11px;
      color: #8888aa;
    }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }
    .legend-dot.y { background: #f5c518; }
    .legend-dot.g { background: #7ec87e; }
    .legend-dot.b { background: #6fa8dc; }
    .legend-dot.p { background: #c084e0; }

    /* SOLVED GROUPS */
    .solved-groups { margin-bottom: 8px; }
    .solved-card {
      border-radius: 10px;
      padding: 11px 16px;
      margin-bottom: 6px;
      text-align: center;
      animation: slideIn 0.35s ease;
    }
    .solved-card .cat  { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    .solved-card .wrds { font-size: 15px; font-weight: 700; }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 12px;
    }
    .tile {
      background: #222232;
      border: 1.5px solid #2e2e42;
      border-radius: 10px;
      color: #f0f0f8;
      font-size: 14px;
      font-weight: 700;
      height: 66px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4px;
      font-family: inherit;
      line-height: 1.25;
      transition: background 0.12s, border-color 0.12s, transform 0.12s, box-shadow 0.12s;
      user-select: none;
    }
    .tile:active  { transform: scale(0.93); }
    .tile.sel     { background: #f0f0f8; color: #0f0f13; border-color: #f0f0f8; transform: scale(1.04); }
    .tile.shake   { animation: shake 0.45s ease; }
    .tile.hinted  { border-color: #6c63ff; box-shadow: 0 0 0 2px rgba(108,99,255,0.25); }
    .tile.hinted.sel { box-shadow: none; }

    /* CONTROLS */
    .controls {
      display: flex;
      gap: 7px;
      justify-content: center;
      margin-bottom: 14px;
    }
    .btn {
      background: none;
      border: 1.5px solid #2e2e42;
      border-radius: 20px;
      color: #8888aa;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 7px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-family: inherit;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn:hover:not(:disabled) { border-color: #8888aa; }
    .btn:disabled { opacity: 0.28; cursor: not-allowed; }
    .btn .ico { font-size: 16px; }
    .btn.submit { border-color: #6c63ff; color: #6c63ff; }
    .btn.submit:disabled { border-color: #2e2e42; color: #8888aa; }

    /* LIVES */
    .lives-row {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      margin-bottom: 4px;
    }
    .lives-lbl { font-size: 13px; font-weight: 700; color: #8888aa; }
    .dot {
      width: 13px; height: 13px;
      border-radius: 50%;
      background: #f0f0f8;
      display: inline-block;
      transition: all 0.25s;
    }
    .dot.lost { background: #3a3a4a; }

    /* GAME-OVER SCREEN */
    .gameover {
      text-align: center;
      padding: 16px 8px;
      animation: slideIn 0.3s ease;
    }
    .gameover .emoji { font-size: 52px; margin-bottom: 10px; }
    .gameover h2    { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
    .gameover p     { color: #8888aa; font-size: 14px; margin-bottom: 14px; }
    .replay-btn {
      background: none;
      border: 1.5px solid #2e2e42;
      border-radius: 12px;
      color: #f0f0f8;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 28px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    .replay-btn:hover { border-color: #8888aa; }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: rgba(20,20,30,0.97);
      border: 1px solid #2e2e42;
      color: #f0f0f8;
      padding: 10px 20px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      transition: all 0.25s;
      z-index: 600;
      text-align: center;
      max-width: 86vw;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* COLOR THEMES */
    .y { background: #f5c518; color: #1a1200; }
    .g { background: #7ec87e; color: #071507; }
    .b { background: #6fa8dc; color: #05101e; }
    .p { background: #c084e0; color: #180028; }

    /* ANIMATIONS */
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-7px); }
      40%     { transform: translateX(7px); }
      60%     { transform: translateX(-4px); }
      80%     { transform: translateX(4px); }
    }

    @media (max-width: 380px) {
      .tile { height: 58px; font-size: 12px; }
    }
  </style>
</head>

// ══════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════
const MAX_LIVES = 4;
let puzzle, tiles, selected, solved, lives, hintsLeft, hintedWords, gameOver;
let lastPuzzleIdx = -1;

function newGame() {
  document.querySelectorAll('.gameover').forEach(el => el.remove());
  let idx;
  do { idx = Math.floor(Math.random() * PUZZLES.length); }
  while (idx === lastPuzzleIdx && PUZZLES.length > 1);
  lastPuzzleIdx = idx;
  puzzle = PUZZLES[idx];
  tiles      = puzzle.groups.flatMap((g, gi) => g.words.map(w => ({ word: w, gi })));
  shuffleArr(tiles);
  selected   = [];
  solved     = [];
  lives      = MAX_LIVES;
  hintsLeft  = 3;
  hintedWords = new Set();
  gameOver   = false;
  document.getElementById('solved').innerHTML    = '';
  document.getElementById('grid').style.display  = 'grid';
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('btn-hint').innerHTML  = '<span class="ico">💡</span>רמז';
  document.getElementById('btn-hint').disabled   = false;
  renderGrid();
  renderLives();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  tiles.forEach((t, i) => {
    const btn = document.createElement('button');
    const isSel    = selected.includes(i);
    const isHinted = hintedWords.has(t.word);
    btn.className  = 'tile' + (isSel ? ' sel' : '') + (isHinted && !isSel ? ' hinted' : '');
    btn.textContent = t.word;
    btn.addEventListener('click', () => toggleTile(i));
    grid.appendChild(btn);
  });
  const nSel = selected.length;
  document.getElementById('btn-clear').disabled  = nSel === 0;
  document.getElementById('btn-submit').disabled = nSel !== 4;
  document.getElementById('btn-hint').disabled   = hintsLeft <= 0 || gameOver;
}

function renderLives() {
  const row = document.getElementById('lives-row');
  row.innerHTML = '<span class="lives-lbl">ניסיונות:</span>';
  for (let i = 0; i < MAX_LIVES; i++) {
    const d = document.createElement('span');
    d.className = 'dot' + (i >= lives ? ' lost' : '');
    row.appendChild(d);
  }
}

function addSolvedCard(group, faded) {
  const card = document.createElement('div');
  card.className = 'solved-card ' + group.color;
  if (faded) card.style.opacity = '0.55';
  card.innerHTML = '<div class="cat">' + group.label + '</div><div class="wrds">' + group.words.join(' · ') + '</div>';
  document.getElementById('solved').appendChild(card);
}

function toggleTile(i) {
  if (gameOver) return;
  const idx = selected.indexOf(i);
  if (idx === -1) { if (selected.length < 4) selected.push(i); }
  else selected.splice(idx, 1);
  renderGrid();
}

function doClear() { selected = []; renderGrid(); }

function doShuffle() { shuffleArr(tiles); selected = []; renderGrid(); }

function doHint() {
  if (hintsLeft <= 0 || gameOver) return;
  const unsolvedGroups = puzzle.groups.filter((_, gi) => !solved.includes(gi));
  if (!unsolvedGroups.length) return;
  const g = unsolvedGroups[Math.floor(Math.random() * unsolvedGroups.length)];
  const unhinted = g.words.filter(w => !hintedWords.has(w));
  const toHint   = unhinted.sort(() => Math.random() - 0.5).slice(0, 2);
  toHint.forEach(w => hintedWords.add(w));
  hintsLeft--;
  document.getElementById('btn-hint').innerHTML = '<span class="ico">💡</span>רמז (' + hintsLeft + ')';
  if (hintsLeft <= 0) document.getElementById('btn-hint').disabled = true;
  showToast('רמז: ' + g.label);
  renderGrid();
}

function doSubmit() {
  if (selected.length !== 4 || gameOver) return;
  const giList  = selected.map(i => tiles[i].gi);
  const allSame = giList.every(gi => gi === giList[0]);
  if (allSame) {
    const gi    = giList[0];
    const group = puzzle.groups[gi];
    solved.push(gi);
    addSolvedCard(group, false);
    const wordsToRemove = new Set(selected.map(i => tiles[i].word));
    tiles    = tiles.filter(t => !wordsToRemove.has(t.word));
    selected = [];
    renderGrid();
    renderLives();
    if (solved.length === puzzle.groups.length) setTimeout(() => showWin(), 350);
  } else {
    const oneAway = puzzle.groups.some((_, gi) => {
      if (solved.includes(gi)) return false;
      return selected.filter(i => tiles[i].gi === gi).length === 3;
    });
    const tileBtns = document.getElementById('grid').querySelectorAll('.tile');
    selected.forEach(i => { if (tileBtns[i]) tileBtns[i].classList.add('shake'); });
    lives--;
    selected = [];
    renderLives();
    if (oneAway) showToast('כמעט! רק מילה אחת מפרידה אותך 😅');
    else         showToast('לא נכון, נסה שוב');
    if (lives <= 0) { gameOver = true; setTimeout(() => showLose(), 500); }
    else setTimeout(() => renderGrid(), 500);
  }
}

function showWin() {
  gameOver = true;
  document.getElementById('grid').style.display     = 'none';
  document.getElementById('controls').style.display = 'none';
  document.getElementById('lives-row').innerHTML    = '';
  const el = document.createElement('div');
  el.className = 'gameover';
  el.innerHTML = '<div class="emoji">🎉</div><h2>כל הכבוד!</h2><p>פתרת את כל הקבוצות!</p><button class="replay-btn" onclick="newGame()">משחק חדש</button>';
  document.querySelector('.page').appendChild(el);
}

function showLose() {
  document.getElementById('grid').style.display     = 'none';
  document.getElementById('controls').style.display = 'none';
  document.getElementById('lives-row').innerHTML    = '';
  puzzle.groups.forEach((g, gi) => { if (!solved.includes(gi)) addSolvedCard(g, true); });
  const el = document.createElement('div');
  el.className = 'gameover';
  el.innerHTML = '<div class="emoji">😔</div><h2>נגמרו הניסיונות</h2><p>הנה הפתרון המלא:</p><button class="replay-btn" onclick="newGame()">נסה שוב</button>';
  document.querySelector('.page').appendChild(el);
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

function shuffleArr(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}
